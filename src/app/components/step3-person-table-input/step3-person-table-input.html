@if(!person){
    <div class="alert alert-dangerous text-center">No person details</div>
} @else {

<table class="table table-bordered w-50">
    <tr>
        <td class="fw-semibold">Firstname</td>
        <td class="ps-2">{{person.firstname}}</td>
    </tr>
    <tr>
        <td class="fw-semibold">Lastname</td>
        <td class="ps-2">{{person.lastname}}</td>
    </tr>
    <tr>
        <td class="fw-semibold">Email</td>
        <td class="ps-2">{{person.email}}</td>
    </tr>
</table>
}
